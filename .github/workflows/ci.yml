name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # E4 事务落盘目录：测试里不落盘（各脚本需要时自己指定临时目录）
      ZWRT_DATAD_OPS_DIR: ""
      ZWRT_DATAD_WRITE_LOCK: ""
      ZWRT_DATAD_PID_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 ../tests/neighbor_parser_test.py target/debug/zwrt-datad
      - run: python3 ../tests/version_test.py target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_http_test.py target/debug/zwrt-datad
      - run: python3 ../tests/direct_supply_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_sse_limit_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_sse_lifecycle_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_legacy_hits_test.py target/debug/zwrt-datad
      - run: ../tests/rust_control_integration.sh
      - run: sh ../tests/listen_orphan_test.sh target/debug/zwrt-datad
      - run: sh ../tests/golden/golden.sh check target/debug/zwrt-datad
      - run: sh ../tests/golden/control_golden.sh check target/debug/zwrt-datad
      - run: sh ../tests/state_v2_doc_check.sh && sh ../tests/state_v2_doc_check.sh --self-test
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
